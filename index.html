<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3초 눈치게임: 사회생활 타이밍 (3-Sec Nunchi Game)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff4757;
            --accent-hover: #ff6b81;
            --text-color: #ffffff;
            --sub-text: #a0a0a0;
            --gold: #ffa502;
            --green: #2ed573;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        /* Top Bar & Lang Switch */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .lang-switch {
            background: #2a2a2a;
            border: 1px solid #444;
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .gold-display {
            color: var(--gold);
            font-weight: bold;
            font-size: 16px;
        }

        /* Stats Area */
        .stats-area {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
            color: var(--sub-text);
        }

        .level-badge {
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Dialogue Box */
        .dialogue-box {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #3a3a3a;
        }

        .character-title {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .dialogue-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Speed Gauge Gauge Area */
        .gauge-container {
            width: 100%;
            height: 35px;
            background: #111;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid #444;
            margin: 20px 0;
        }

        .target-zone {
            position: absolute;
            height: 100%;
            background: rgba(46, 213, 115, 0.4);
            border-left: 2px solid var(--green);
            border-right: 2px solid var(--green);
        }

        .needle {
            position: absolute;
            top: 0;
            width: 6px;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff;
            left: 0%;
            transform: translateX(-50%);
        }

        /* Main Action Button */
        .action-btn {
            width: 100%;
            height: 120px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(145deg, var(--accent-color), #d63031);
            color: white;
            font-size: 24px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #900c3f, 0 10px 20px rgba(0,0,0,0.4);
            transition: all 0.05s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #900c3f, 0 4px 10px rgba(0,0,0,0.4);
        }

        .sub-btn-text {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.8;
        }

        /* Roguelike Power-Up Modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-title {
            font-size: 22px;
            color: var(--gold);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .card {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .card:hover {
            border-color: var(--gold);
            transform: scale(1.02);
        }

        .card-name {
            font-weight: bold;
            font-size: 16px;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--sub-text);
        }

        /* Shop & Equipment */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--sub-text);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-btn.active {
            color: var(--gold);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Top Header -->
    <div class="top-bar">
        <button class="lang-switch" onclick="toggleLanguage()">🌐 <span id="lang-text">EN</span></button>
        <div class="gold-display">🪙 <span id="gold-val">0</span></div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-area">
        <div><span id="txt-lvl">레벨</span>: <span id="lvl-val" class="level-badge">1</span></div>
        <div><span id="txt-hp">멘탈</span>: <span id="hp-val">❤️❤️❤️</span></div>
    </div>

    <!-- Boss/Normal Dialogue Box -->
    <div class="dialogue-box">
        <div class="character-title" id="char-title">부장님 (Boss)</div>
        <div class="dialogue-text" id="char-dialogue">"어이, 이번 프로젝트 주말까지 제출하게."</div>
    </div>

    <!-- Timing Gauge -->
    <div class="gauge-container">
        <div class="target-zone" id="target-zone"></div>
        <div class="needle" id="needle"></div>
    </div>

    <!-- Main Action Button -->
    <button class="action-btn" id="action-btn" onclick="handleTap()">
        <span id="btn-main-text">3초 눈치 템포 잡기!</span>
        <span class="sub-btn-text" id="btn-sub-text">타이밍존 안에서 클릭하세요</span>
    </button>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="openGameTab()">🎮 <span id="nav-game">게임</span></button>
        <button class="nav-btn" onclick="openShopModal()">🕶️ <span id="nav-shop">스킨 상점</span></button>
    </div>
</div>

<!-- Roguelike Power-up Modal -->
<div class="modal" id="powerup-modal">
    <div class="modal-title" id="powerup-title">⚡ 파워업 선택</div>
    <div class="card-list" id="powerup-cards"></div>
</div>

<!-- Shop Modal -->
<div class="modal" id="shop-modal">
    <div class="modal-title" id="shop-title">🕶️ 직장인 필수 장비</div>
    <div class="card-list">
        <div class="card" onclick="buySkin('glasses', 50)">
            <div class="card-name">🕶️ 보안 안경 (Privacy Glasses)</div>
            <div class="card-desc" id="shop-desc-1">타이밍 성공 존 크기 +15% 증가 | 가격: 🪙50</div>
        </div>
        <div class="card" onclick="buySkin('headphone', 100)">
            <div class="card-name">🎧 노이즈 캔슬링 헤드폰</div>
            <div class="card-desc" id="shop-desc-2">보스전 페이크 속도 감쇠 | 가격: 🪙100</div>
        </div>
    </div>
    <button class="action-btn" style="height: 45px; font-size: 14px; margin-top: 15px;" onclick="closeShopModal()">닫기 / Close</button>
</div>

<script>
    // Game State Variables
    let currentLang = 'KO'; // 'KO' or 'EN'
    let level = 1;
    let gold = 0;
    let hp = 3;
    let needlePos = 0;
    let needleSpeed = 1.2;
    let needleDirection = 1;
    let animFrameId = null;

    let targetStart = 40; // %
    let targetWidth = 20;  // %

    // Player Powerups
    let bonusZoneWidth = 0;
    let speedSlowMult = 1.0;

    // Translations Dictionary
    const i18n = {
        KO: {
            langText: "EN",
            lvl: "레벨",
            hp: "멘탈",
            btnMain: "3초 눈치 템포 잡기!",
            btnSub: "타이밍존 안에서 클릭하세요",
            navGame: "게임",
            navShop: "스킨 상점",
            powerupTitle: "⚡ 직장인 생존 능력 선택",
            shopTitle: "🕶️ 직장인 필수 장비",
            shopDesc1: "타이밍 성공 존 크기 +15% 증가 | 가격: 🪙50",
            shopDesc2: "보스전 페이크 속도 감쇠 | 가격: 🪙100",
            bossTitle: "부장님 (Boss Stage ",
            normalTitle: "직속 선임 ",
            normalDialogue: ["\"야, 이번 자료 언제 완성돼?\"", "\"눈치껏 칼퇴각 잡아봐라.\"", "\"회의록 정리했어?\""],
            bossDialogue: ["\"주말 잔업 가능하지?\"", "\"내 말 뜻 몰라? 타이밍 맞춰!\"", "\"요즘 젊은 친구들은 눈치가...\""],
            successText: "🎯 타이밍 성공! 나이스!",
            failText: "💥 타이밍 실패! 야근 확정...",
            card1Title: "☕ 믹스커피 마시기",
            card1Desc: "바늘 이동 속도가 15% 느려집니다.",
            card2Title: "👓 눈치 백단 안경",
            card2Desc: "타이밍 성공 영역이 20% 넓어집니다.",
            card3Title: "🛡️ 칼퇴의 의지",
            card3Desc: "멘탈(체력)을 1 회복합니다."
        },
        EN: {
            langText: "KO",
            lvl: "LVL",
            hp: "HP",
            btnMain: "Catch 3-Sec Timing!",
            btnSub: "Click inside the green zone!",
            navGame: "Game",
            navShop: "Shop",
            powerupTitle: "⚡ Select Office Perk",
            shopTitle: "🕶️ Survival Equipment",
            shopDesc1: "Target Zone Size +15% | Price: 🪙50",
            shopDesc2: "Slowing Down Boss Fake Speeds | Price: 🪙100",
            bossTitle: "Executive Boss (Stage ",
            normalTitle: "Senior Coworker ",
            normalDialogue: ["\"Is that report done yet?\"", "\"Read the room and wrap it up!\"", "\"Are you ready for the presentation?\""],
            bossDialogue: ["\"Can you work this weekend?\"", "\"Do you lack workplace tact?\"", "\"Timing is everything in business!\""],
            successText: "🎯 Perfect Timing!",
            failText: "💥 Missed! Overtime confirmed...",
            card1Title: "☕ Instant Coffee",
            card1Desc: "Decreases gauge needle speed by 15%.",
            card2Title: "👓 Eagle Eye Glasses",
            card2Desc: "Target success zone increases by 20%.",
            card3Title: "🛡️ Will to Leave On-Time",
            card3Desc: "Restores 1 Mental HP."
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'KO' ? 'EN' : 'KO';
        updateUI();
    }

    function updateUI() {
        const t = i18n[currentLang];
        document.getElementById('lang-text').innerText = t.langText;
        document.getElementById('txt-lvl').innerText = t.lvl;
        document.getElementById('txt-hp').innerText = t.hp;
        document.getElementById('btn-main-text').innerText = t.btnMain;
        document.getElementById('btn-sub-text').innerText = t.btnSub;
        document.getElementById('nav-game').innerText = t.navGame;
        document.getElementById('nav-shop').innerText = t.navShop;
        document.getElementById('powerup-title').innerText = t.powerupTitle;
        document.getElementById('shop-title').innerText = t.shopTitle;
        document.getElementById('shop-desc-1').innerText = t.shopDesc1;
        document.getElementById('shop-desc-2').innerText = t.shopDesc2;
        renderHP();
        updateDialogue();
    }

    function renderHP() {
        let hpStr = "";
        for(let i=0; i<hp; i++) hpStr += "❤️";
        for(let i=hp; i<3; i++) hpStr += "🖤";
        document.getElementById('hp-val').innerText = hpStr;
    }

    function updateDialogue() {
        const t = i18n[currentLang];
        const isBoss = (level % 5 === 0);
        if(isBoss) {
            document.getElementById('char-title').innerText = t.bossTitle + level + ")";
            document.getElementById('char-dialogue').innerText = t.bossDialogue[Math.floor(Math.random()*t.bossDialogue.length)];
        } else {
            document.getElementById('char-title').innerText = t.normalTitle + "(LV " + level + ")";
            document.getElementById('char-dialogue').innerText = t.normalDialogue[Math.floor(Math.random()*t.normalDialogue.length)];
        }
    }

    function resetTargetZone() {
        targetWidth = Math.max(10, 25 - level * 0.8) + bonusZoneWidth;
        targetStart = Math.floor(Math.random() * (90 - targetWidth));
        
        const tz = document.getElementById('target-zone');
        tz.style.left = targetStart + "%";
        tz.style.width = targetWidth + "%";
    }

    function animateNeedle() {
        needlePos += needleSpeed * needleDirection * speedSlowMult;
        if(needlePos >= 100) {
            needlePos = 100;
            needleDirection = -1;
        } else if(needlePos <= 0) {
            needlePos = 0;
            needleDirection = 1;
        }

        document.getElementById('needle').style.left = needlePos + "%";
        animFrameId = requestAnimationFrame(animateNeedle);
    }

    function handleTap() {
        if(needlePos >= targetStart && needlePos <= (targetStart + targetWidth)) {
            // Success
            gold += 10 + level * 2;
            document.getElementById('gold-val').innerText = gold;
            level++;
            document.getElementById('lvl-val').innerText = level;

            if(level % 3 === 0) {
                openPowerupModal();
            } else {
                nextStage();
            }
        } else {
            // Fail
            hp--;
            renderHP();
            if(hp <= 0) {
                alert(i18n[currentLang].failText + "\nGame Over! Final Level: " + level);
                level = 1;
                hp = 3;
                gold = 0;
                document.getElementById('gold-val').innerText = gold;
                document.getElementById('lvl-val').innerText = level;
            }
            nextStage();
        }
    }

    function nextStage() {
        updateUI();
        resetTargetZone();
        needleSpeed = (1.2 + level * 0.15);
    }

    // Roguelike Modal Logic
    function openPowerupModal() {
        cancelAnimationFrame(animFrameId);
        const t = i18n[currentLang];
        const modal = document.getElementById('powerup-modal');
        const cardsDiv = document.getElementById('powerup-cards');
        
        cardsDiv.innerHTML = `
            <div class="card" onclick="selectPowerup(1)">
                <div class="card-name">${t.card1Title}</div>
                <div class="card-desc">${t.card1Desc}</div>
            </div>
            <div class="card" onclick="selectPowerup(2)">
                <div class="card-name">${t.card2Title}</div>
                <div class="card-desc">${t.card2Desc}</div>
            </div>
            <div class="card" onclick="selectPowerup(3)">
                <div class="card-name">${t.card3Title}</div>
                <div class="card-desc">${t.card3Desc}</div>
            </div>
        `;
        modal.style.display = 'flex';
    }

    function selectPowerup(type) {
        if(type === 1) speedSlowMult *= 0.85;
        if(type === 2) bonusZoneWidth += 5;
        if(type === 3) hp = Math.min(3, hp + 1);

        document.getElementById('powerup-modal').style.display = 'none';
        nextStage();
        animateNeedle();
    }

    // Shop Modals
    function openShopModal() {
        document.getElementById('shop-modal').style.display = 'flex';
    }

    function closeShopModal() {
        document.getElementById('shop-modal').style.display = 'none';
    }

    function buySkin(type, price) {
        if(gold >= price) {
            gold -= price;
            document.getElementById('gold-val').innerText = gold;
            if(type === 'glasses') bonusZoneWidth += 4;
            alert("구매 완료! / Purchase Complete!");
            closeShopModal();
            resetTargetZone();
        } else {
            alert("골드가 부족합니다! / Not enough gold!");
        }
    }

    // Init
    updateUI();
    resetTargetZone();
    animateNeedle();
</script>
</body>
</html>
